# state owned, invariants, extension points, known limits).

[component."sim:crates/simthesizer-core/src/model_runners/rooflang.rs"]
depends_on = ["sim:scripts/rooflang_worker.py"]
role = "Tier-2 model runner: sends each round to the Python RoofLang worker, receives the priced op graph, executes it on the fluid-shared resource engine"
interface = "ModelRunner (register name `rooflang`); config: tp, ep, pp, lowering, kv devices"
state = "per-request logical state (MLA/KDA), stream tails across rounds (PP chaining)"
invariants = ["device ownership across PP stages", "stream slots exclusive, FIFO by readiness"]
extension_points = ["new lowering selected by `lowering` and priced in the bridge"]

[component."sim:scripts/rooflang_worker.py"]
role = "worker process: builds the Kimi/Qwen RoofLang template for a runner and exports per-round operations"

[component."sim:crates/simthesizer-core/src/model_runners/step_model.rs"]
